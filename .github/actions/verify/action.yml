name: Build and verify
description: Rust checks, WebAssembly build, package build and tests, Next.js example build and the browser smoke test.
runs:
  using: composite
  steps:
    - name: Rust checks
      shell: bash
      run: |
        cargo fmt --check
        cargo clippy --locked --target wasm32-unknown-unknown -p wordcraft-embed -- -D warnings
        cargo test --locked -p wordcraft-embed
    - name: Build WebAssembly
      shell: bash
      run: scripts/build-wasm.sh
    - name: Build and test the package
      shell: bash
      working-directory: packages/wordcraft-react
      run: |
        cp ../../README.md README.md
        npm install --no-audit --no-fund
        npm run typecheck
        npm run build
        npm test
        npm pack --dry-run
    - name: Build the Next.js example
      shell: bash
      working-directory: examples/nextjs
      run: |
        npm install --no-audit --no-fund
        npm run build
    - name: Browser smoke test
      shell: bash
      working-directory: examples/nextjs
      run: |
        WORDCRAFT_FAKE_AI=1 npx next start -p 3000 > next.log 2>&1 &
        for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
        WORDCRAFT_FAKE_AI=1 npm run smoke -- http://localhost:3000/
    - name: Co-editing smoke test (two browsers through y-websocket)
      shell: bash
      working-directory: examples/nextjs
      run: |
        npm run collab-server > collab.log 2>&1 &
        for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/1234) 2>/dev/null && break; sleep 1; done
        npm run smoke:collab -- http://localhost:3000
    - name: Keep screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: smoke-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          examples/nextjs/smoke-*.png
          examples/nextjs/collab-*.png
        if-no-files-found: ignore
