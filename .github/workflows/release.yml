# Publish @gamine/wordcraft-react to npm.
#
# Runs when a commit on main changes the package version (the tag and GitHub release are then
# created for you), on a pushed v* tag, by hand (Actions > Release > Run workflow), or when the
# upstream sync workflow calls it after tagging a new version. It verifies the exact tagged source
# (including the browser smoke test) before publishing, and skips versions already on npm.
#
# Auth: an NPM_TOKEN secret (granular token with publish rights on @gamine), or npm trusted
# publishing for this repository and workflow (then no secret is needed).
name: Release

on:
  push:
    branches: [main]
    paths: ['packages/wordcraft-react/package.json']
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag to release, e.g. v0.1.1
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  # A newer push to main supersedes a release still building from an older commit.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Version and tag
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          v=$(node -p "require('./packages/wordcraft-react/package.json').version")
          ref="${INPUT_REF:-$GITHUB_REF_NAME}"
          case "$ref" in
            v*) [ "v$v" = "$ref" ] || { echo "::error::tag $ref != package version $v"; exit 1; } ;;
            *) ref="v$v" ;;  # a branch: release the version in package.json at this commit
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "REF=$ref" >> "$GITHUB_ENV"
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Already published?
        id: npm
        run: |
          if npm view "@gamine/wordcraft-react@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "::notice::$VERSION is already on npm; skipping publish"
          fi
      - uses: ./.github/actions/setup
        if: steps.npm.outputs.already != 'true'
      - uses: ./.github/actions/verify
        if: steps.npm.outputs.already != 'true'
      - name: Publish to npm
        if: steps.npm.outputs.already != 'true'
        working-directory: packages/wordcraft-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm i -g npm@11   # trusted publishing needs npm >= 11.5
          npm publish --access public --provenance
      - name: GitHub release
        # Also runs when npm already has the version, so a release that failed here can be redone.
        # GitHub refuses the workflow token a tag on a commit that changes workflow files, so the tag
        # then goes on the nearest earlier commit that doesn't (same package source).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$REF" >/dev/null 2>&1 && { echo "$REF already has a GitHub release"; exit 0; }
          { python3 scripts/changelog.py notes "${REF#v}"; echo; echo "Upstream WordCraft: storytold/wordcraft@$(cat UPSTREAM_REV)"; } > notes.md
          git fetch -q --deepen=50 origin || true
          for c in $(git rev-list -n 50 "$TARGET"); do
            if [ -n "$(git diff-tree --no-commit-id --name-only -r "$c" -- .github/workflows)" ]; then continue; fi
            if gh release create "$REF" --target "$c" --title "$REF" --notes-file notes.md; then echo "tagged $REF at $c"; exit 0; fi
          done
          echo "::warning::Couldn't create the $REF GitHub release; create it by hand from CHANGELOG.md"
