# Publish @gamine/wordcraft-react to npm.
#
# Runs on a pushed v* tag, by hand (Actions > Release > Run workflow, on a tag), or when the
# upstream sync workflow calls it after tagging a new version. It verifies the exact tagged source
# (including the browser smoke test) before publishing, and skips versions already on npm.
#
# Auth: an NPM_TOKEN secret (granular token with publish rights on @gamine), or npm trusted
# publishing for this repository and workflow (then no secret is needed).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag to release, e.g. v0.1.1
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Version must match the tag
        run: |
          v=$(node -p "require('./packages/wordcraft-react/package.json').version")
          case "$REF" in v*) ;; *) echo "::error::Release runs on a v* tag, got $REF"; exit 1;; esac
          [ "v$v" = "$REF" ] || { echo "::error::tag $REF != package version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Already published?
        id: npm
        run: |
          if npm view "@gamine/wordcraft-react@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "::notice::$VERSION is already on npm; skipping publish"
          fi
      - uses: ./.github/actions/setup
        if: steps.npm.outputs.already != 'true'
      - uses: ./.github/actions/verify
        if: steps.npm.outputs.already != 'true'
      - name: Publish to npm
        if: steps.npm.outputs.already != 'true'
        working-directory: packages/wordcraft-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm i -g npm@11   # trusted publishing needs npm >= 11.5
          npm publish --access public --provenance
      - name: GitHub release
        if: steps.npm.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$REF" >/dev/null 2>&1 || gh release create "$REF" --verify-tag --generate-notes \
            --notes "Upstream WordCraft: storytold/wordcraft@$(cat UPSTREAM_REV)"
