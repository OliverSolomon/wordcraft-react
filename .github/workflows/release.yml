# Publish @gamine/wordcraft-react to npm when a tag like v0.1.0 is pushed.
# Needs the repository secret NPM_TOKEN (an npm automation token with publish rights on @gamine).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen-cli and binaryen
        run: |
          WBG=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$WBG" --locked
          npm i -g binaryen
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./packages/wordcraft-react/package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version $v"; exit 1; }
      - run: scripts/build-wasm.sh
      - name: Build and publish
        working-directory: packages/wordcraft-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
          npm publish --access public --provenance
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
