[package]
name = "wordcraft-embed"
description = "WordCraft as an embeddable browser component (wasm-bindgen API over the upstream egui app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-doc = { workspace = true }
egui = "0.36"
log = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same feature set as upstream apps/wordcraft-web: WebGPU with WebGL2 fallback.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.17"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "CssStyleDeclaration", "Event", "EventTarget", "BeforeUnloadEvent"] }
