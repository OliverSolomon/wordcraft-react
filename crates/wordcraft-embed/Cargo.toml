[package]
name = "wordcraft-embed"
description = "WordCraft as an embeddable browser component (wasm-bindgen API over the upstream egui app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-collab = { path = "../wordcraft-collab" }
egui = "0.37"
# The Craft libraries upstream's web app runs on (files, clipboard, print, the UI runtime), at
# upstream's rev (scripts/sync-upstream.py keeps it in step).
craft = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", version = "=0.1.0", default-features = false, features = ["platform-browser", "platform-appearance", "platform-clipboard", "print", "ui", "window"] }
log = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same feature set as upstream apps/wordcraft-web: WebGPU with WebGL2 fallback.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "=0.2.129"
yrs = "0.28"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Blob", "CssStyleDeclaration", "Event", "EventTarget", "BeforeUnloadEvent", "ClipboardEvent", "DataTransfer", "FileList", "File"] }
