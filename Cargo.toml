[workspace]
resolver = "3"
members = ["crates/wordcraft-embed", "crates/wordcraft-collab"]
# Upstream WordCraft is checked out (and patched) here by scripts/prepare-upstream.sh.
exclude = ["upstream"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

# Upstream WordCraft, pinned to the commit in UPSTREAM_REV and patched with patches/*.patch by
# scripts/prepare-upstream.sh (run it before building). scripts/sync-upstream.py moves the pin.
[workspace.dependencies]
wordcraft-engine = { path = "upstream/crates/engine" }
wordcraft-ui-egui = { path = "upstream/crates/ui-egui" }
wordcraft-doc = { path = "upstream/crates/doc" }
wordcraft-fonts = { path = "upstream/crates/fonts" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
